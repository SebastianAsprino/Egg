<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posicionando elementos!</title>
    <link href="index.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="ejemplo relative">
        <div class="item"><img src="static-01.jpg" alt="Ejemplo de posición static" /></div>
        <div class="item item-relative">
          <img src="relative-01.jpg" alt="Ejemplo de posición relative" />
        </div>
        <div class="item"><img src="static-01.jpg" alt="Ejemplo de posición static" /></div>
      </div>
    </div>

    <div class="container">
      <div class="ejemplo absolute">
        <div class="item"><img src="static-01.jpg" alt="Ejemplo de posición static" /></div>
        <div class="item item-absolute">
          <img src="absolute-01.jpg" alt="Ejemplo de posición absolute" />
        </div>
        <div class="item"><img src="static-01.jpg" alt="Ejemplo de posición static" /></div>
      </div>
    </div>

    <div class="container">
      <div class="ejemplo fixed">
        <div class="item"><img src="static-01.jpg" alt="Ejemplo de posición static" /></div>
        <div class="item item-fixed"><img src="fixed-01.jpg" alt="Ejemplo de posición fixed" /></div>
        <div class="item"><img src="static-01.jpg" alt="Ejemplo de posición static" /></div>
      </div>
    </div>
  </body>
</html>
